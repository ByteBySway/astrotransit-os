<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#03060d" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a1224" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="host-star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-fx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <circle cx="950" cy="200" r="280" fill="url(#star-glow)" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Starfield -->
  <g fill="#ffffff">
    <circle cx="120" cy="65" r="1" opacity="0.6" />
    <circle cx="280" cy="140" r="1.5" opacity="0.8" />
    <circle cx="450" cy="45" r="1" opacity="0.5" />
    <circle cx="620" cy="110" r="1.2" opacity="0.7" />
    <circle cx="750" cy="70" r="1.8" opacity="0.9" />
    <circle cx="890" cy="90" r="1" opacity="0.6" />
    <circle cx="1100" cy="130" r="1.5" opacity="0.8" />
    <circle cx="150" cy="310" r="1.2" opacity="0.6" />
    <circle cx="340" cy="270" r="1" opacity="0.4" />
    <circle cx="510" cy="350" r="1.5" opacity="0.7" />
    <circle cx="710" cy="330" r="1" opacity="0.5" />
    <circle cx="840" cy="280" r="2" opacity="0.85" />
    <circle cx="1040" cy="320" r="1.2" opacity="0.6" />
    <circle cx="1160" cy="260" r="1" opacity="0.5" />
  </g>

  <!-- Orbit Dynamics Graphic (Right side) -->
  <g transform="translate(920, 200)">
    <!-- Habitable Zone Ring -->
    <ellipse cx="0" cy="0" rx="190" ry="85" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="18" stroke-dasharray="6,6" transform="rotate(-15)" />
    <!-- Elliptical Orbit Track -->
    <ellipse cx="20" cy="0" rx="160" ry="70" fill="none" stroke="rgba(0, 240, 255, 0.45)" stroke-width="1.8" transform="rotate(-15)" />
    <!-- Host Star -->
    <circle cx="0" cy="0" r="32" fill="url(#host-star)" filter="url(#glow-fx)" />
    <!-- Planet along orbit -->
    <g transform="rotate(-15)">
      <circle cx="150" cy="-28" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-fx)" />
      <!-- Planet Atmosphere Glow -->
      <circle cx="150" cy="-28" r="14" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    </g>
  </g>

  <!-- Photometric Light Curve Graphic (Bottom overlay) -->
  <path d="M 80,310 L 420,310 Q 470,310 490,345 L 530,345 Q 550,310 600,310 L 820,310" 
        fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" filter="url(#glow-fx)" />
  <!-- Transit ingress/egress dots -->
  <circle cx="470" cy="310" r="3" fill="#00f0ff" />
  <circle cx="510" cy="345" r="4" fill="#34d399" />
  <circle cx="550" cy="310" r="3" fill="#00f0ff" />
  <text x="510" y="370" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" text-anchor="middle">TRANSIT t0 (ΔF/F)</text>

  <!-- Branding and Typography (Left side) -->
  <g transform="translate(80, 110)">
    <!-- Subtitle chip -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#00f0ff" letter-spacing="1.5">ASTROPHYSICAL SUITE</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      AstroTransit <tspan fill="url(#cyan-glow)">OS</tspan>
    </text>

    <!-- Description line -->
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Photometric Transit Vetting Terminal · Mandel–Agol Fitting · 3D Keplerian Dynamics
    </text>

    <!-- Live Telemetry Tags -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="130" height="22" rx="4" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="8" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">● NASA TAP SYNC</text>

      <rect x="140" y="0" width="125" height="22" rx="4" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="148" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">● MANDEL-AGOL</text>

      <rect x="275" y="0" width="120" height="22" rx="4" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="283" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24">● WEB AUDIO 3D</text>
    </g>
  </g>
</svg>
