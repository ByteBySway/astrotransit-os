    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {

        --font-body: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;

      @supports (height: 100dvh) {

          --u: max(min(.72px, calc(100dvh / 700)), min(calc(100vw / 1353), calc(100dvh / 1163)));
          --vshift: calc(max(0px, (100dvh - var(--dh-px))) * .42);
        }
      }
      html, body { height: 100%; width: 100%; }
      body {

      }

      .stage { position: fixed; inset: 0; overflow: hidden; isolation: isolate; }

      .sky {
        position: absolute; inset: 0; z-index: 0;

        background-size: cover; background-position: center; background-repeat: no-repeat;
      }

      }
      .sky video.is-active { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { .sky video { display: none; } }

      .planet {
        position: absolute; z-index: -1; padding: 0; border: 0; background: none;
        -webkit-appearance: none; appearance: none; line-height: 0; cursor: pointer;
        pointer-events: auto;
        transition: transform .45s cubic-bezier(.22, 1, .36, 1);
      }
      .planet img { display: none; width: 100%; height: auto; }
      .planet img.is-shown { display: block; }
      .planet:hover { transform: scale(1.045); }

      .planet-r { width: calc(143 * var(--u)); right: calc(-64.7 * var(--u)); top: calc(-40.6 * var(--u)); }

      .copy { position: absolute; inset: 0; transform: translateY(var(--vshift)); pointer-events: none; }
      .copy a { pointer-events: auto; }
      .col { position: absolute; left: 0; right: calc(var(--gutter) * var(--u)); text-align: center; }

      .navbar { position: absolute; top: 0; left: 0; right: 0; z-index: 6; height: calc(88 * var(--u)); }
      .navbar::after {
        content: ""; position: absolute; left: calc(25 * var(--u)); right: calc(49 * var(--u));
        top: calc(86 * var(--u)); height: calc(2 * var(--u)); background: var(--rule);
      }
      .navrow {
        position: absolute; left: calc(25 * var(--u)); right: calc(49 * var(--u)); top: 0;
        height: calc(86 * var(--u)); display: flex; align-items: center; justify-content: space-between;
      }
      .logo {
        font-family: var(--font-logo); font-weight: 600; font-size: calc(18.4 * var(--u));

        white-space: nowrap; position: relative; top: calc(-1 * var(--u));
      }
      .logo i { font-style: normal; color: var(--cyan-logo); }
      .logo span { font-size: calc(11 * var(--u)); font-weight: 700; background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.4); padding: calc(2 * var(--u)) calc(6 * var(--u)); border-radius: calc(6 * var(--u)); margin-left: calc(6 * var(--u)); vertical-align: middle; }

      .burger {

      .burger span {

      }
      .navrow[data-open="true"] .burger span:nth-child(1) { transform: translateY(calc(8 * var(--u))) rotate(45deg); }
      .navrow[data-open="true"] .burger span:nth-child(2) { opacity: 0; }
      .navrow[data-open="true"] .burger span:nth-child(3) { transform: translateY(calc(-8 * var(--u))) rotate(-45deg); }

      .links { display: flex; align-items: center; }
      .links a {

        text-decoration: none; padding: 0 calc(17.5 * var(--u));
        letter-spacing: calc(-1 * var(--u)); white-space: nowrap;

        font-size: calc(16 * var(--u)); font-weight: 600; letter-spacing: calc(-0.5 * var(--u));
        line-height: 1; color: var(--btn-ink); text-decoration: none; padding-top: calc(2 * var(--u));
        background: linear-gradient(180deg, #ffffff 0%, #d8ecfe 9%, #dceefe 72%, #f4f9ff 100%);
        box-shadow: 0 calc(3 * var(--u)) calc(14 * var(--u)) rgba(255,255,255,.22), inset 0 0 0 calc(1.5 * var(--u)) rgba(255,255,255,.92);
        flex: none;
      }

      .eyebrow {
        top: calc(188.8 * var(--u)); font-size: calc(30.45 * var(--u)); font-weight: 500;
        line-height: 1; letter-spacing: calc(4 * var(--u)); text-indent: calc(4 * var(--u)); color: #fff;
      }
      h1.title {
        top: calc(268 * var(--u)); font-family: var(--font-serif); font-weight: 400;
        font-size: calc(112.4 * var(--u)); line-height: 1; letter-spacing: calc(2 * var(--u));
        text-indent: calc(2 * var(--u)); color: #fff;
      }
      .rule {
        top: calc(405.5 * var(--u)); height: calc(5 * var(--u)); font-size: 0; line-height: 0;
        padding-right: calc(2 * var(--u));
      }
      .rule span {
        display: inline-block; vertical-align: top; width: calc(100 * var(--u));
        height: 100%; border-radius: calc(2.5 * var(--u)); background: var(--cyan);
      }
      p.lede {
        top: calc(433.2 * var(--u)); font-size: calc(18.36 * var(--u)); font-weight: 400;
        line-height: calc(30 * var(--u)); color: rgba(255,255,255,.95); max-width: calc(720 * var(--u));
        margin: 0 auto;
      }

      .cta { top: calc(597 * var(--u)); height: calc(66 * var(--u)); isolation: isolate; }
      .cta a {
        display: inline-flex; align-items: center; justify-content: center;
        width: calc(216 * var(--u)); height: calc(66 * var(--u)); border-radius: calc(33 * var(--u));
        font-size: calc(17 * var(--u)); font-weight: 700; letter-spacing: 0; text-indent: 0;
        line-height: 1; color: var(--btn-ink); text-decoration: none; padding-top: calc(2 * var(--u));
        background: linear-gradient(180deg, #ffffff 0%, #d6e8f8 4%, #d9ecfe 72%, #ffffff 100%);
        box-shadow: 0 calc(10 * var(--u)) calc(18 * var(--u)) calc(-8 * var(--u)) rgba(255,255,255,.50),
                    0 0 calc(26 * var(--u)) rgba(255,255,255,.18),
                    inset 0 0 0 calc(2 * var(--u)) rgba(255,255,255,.9);
        transition: transform .2s ease;
      }
      .cta a:hover { transform: scale(1.03); }

      .label {
        position: absolute; top: calc(33 * var(--u)); font-family: var(--font-serif);

        line-height: 1; color: #fff; white-space: nowrap; pointer-events: none;

      .label.label-l { left: calc(111 * var(--u)); }
      .label.label-r { right: calc(104 * var(--u)); }

      .scroll {
        position: absolute; z-index: 4; left: 50%;
        margin-left: calc((-48 - (var(--gutter) / 2)) * var(--u)); bottom: calc(68 * var(--u));
        width: calc(96 * var(--u)); height: calc(96 * var(--u)); border-radius: 50%;
        background: rgba(24, 30, 42, .70); -webkit-backdrop-filter: blur(calc(6 * var(--u)));
        backdrop-filter: blur(calc(6 * var(--u))); border: 0; display: flex; align-items: center;
        justify-content: center; cursor: pointer; transition: transform .2s ease;
      }
      .scroll:hover { transform: scale(1.06); }
      .scroll svg { width: calc(20 * var(--u)); height: calc(25 * var(--u)); display: block; }

      .scroll:focus-visible, .links a:focus-visible, .enroll:focus-visible,

        outline: calc(2 * var(--u)) solid var(--cyan); outline-offset: calc(3 * var(--u));
      }
      .planet:focus-visible {
        outline: calc(2 * var(--u)) solid var(--cyan); outline-offset: calc(6 * var(--u)); border-radius: 50%;
      }

      .ent-mask { display: inline-block; overflow: hidden; vertical-align: top; }
      .ent-line { display: inline-block; will-change: transform, opacity; }

      /* ================= RESPONSIVE ENGINE (6 TIERS) ================= */
      /* Tier A: Nav Collapse */
      @media (max-width: 1030px), (max-height: 620px) {
        .navrow { left: calc(25 * var(--u)); right: calc(25 * var(--u)); }
        .burger { display: flex; }
        .links {
          position: absolute; top: calc(96 * var(--u)); right: 0; z-index: 5;
          width: min(calc(324 * var(--u)), calc(100vw - 50 * var(--u)));
          flex-direction: column; align-items: stretch; padding: calc(12 * var(--u));
          border-radius: calc(20 * var(--u)); background: rgba(9, 21, 42, .88);
          backdrop-filter: blur(calc(18 * var(--u))); -webkit-backdrop-filter: blur(calc(18 * var(--u)));
          border: calc(1 * var(--u)) solid rgba(255, 255, 255, .14);
          box-shadow: 0 calc(18 * var(--u)) calc(44 * var(--u)) rgba(2, 8, 20, .55);
          opacity: 0; visibility: hidden; transform: translateY(calc(-10 * var(--u)));
          transition: opacity .24s ease, transform .28s cubic-bezier(.4, 0, .2, 1), visibility .28s;
        }
        .navrow[data-open="true"] .links { opacity: 1; visibility: visible; transform: none; }
        .links a:nth-child(n) {
          margin-left: 0; height: auto; justify-content: flex-start;
          padding: calc(14 * var(--u)) calc(16 * var(--u)); font-size: calc(18 * var(--u));
          letter-spacing: calc(-.6 * var(--u));
        }
        .links a + a { border-top: calc(1 * var(--u)) solid rgba(255, 255, 255, .08); }
        .links a[aria-current="page"]::after {
          top: auto; bottom: calc(9 * var(--u)); left: calc(16 * var(--u)); right: auto;
          width: calc(26 * var(--u)); height: calc(3 * var(--u));
        }
        .links a.enroll {
          margin: calc(14 * var(--u)) 0 calc(2 * var(--u)); width: 100%;
          height: calc(46 * var(--u)); border-radius: calc(23 * var(--u)); justify-content: center;
          padding-top: calc(2 * var(--u)); font-size: calc(18 * var(--u)); border-top: 0;
        }
      }

      /* Tier B: Tablet Centered */
      @media (min-width: 580px) and (max-width: 1030px) and (min-height: 621px) {
        :root {
          --gutter: 0;
          --u: min(max(min(.85px, calc(100vh / 780)), min(calc(100vw / 900), calc(100vh / 1163))), 1.15px);
          --dh-px: calc(1120 * var(--u));
          --vshift: calc(max(0px, (100vh - var(--dh-px))) * .38);
        }
        .navbar::after { left: calc(25 * var(--u)); right: calc(25 * var(--u)); }
        p.lede { max-width: calc(620 * var(--u)); margin-left: auto; margin-right: auto; text-wrap: pretty; }
        .label.label-r { right: calc(116 * var(--u)); }
      }

      /* Tier C: Phone Flow */
      @media (max-width: 579px), (max-height: 620px) {
        :root {
          --gutter: 0;
          --u: max(min(.92px, calc(100vh / 620)), min(calc(100vw / 430), calc(100vh / 880)));
          --dh-px: calc(880 * var(--u));
          --vshift: calc(max(0px, (100vh - var(--dh-px))) * .34);
        }
        .navbar { height: calc(76 * var(--u)); }
        .navbar::after { left: calc(24 * var(--u)); right: calc(24 * var(--u)); top: calc(74 * var(--u)); }
        .navrow { left: calc(24 * var(--u)); right: calc(24 * var(--u)); height: calc(74 * var(--u)); }
        .links { top: calc(84 * var(--u)); }
        .copy {
          top: calc(76 * var(--u)); display: flex; flex-direction: column; align-items: center;
          padding: calc(48 * var(--u)) calc(24 * var(--u)) 0;
        }
        .col { position: static; width: 100%; right: auto; }
        .eyebrow { font-size: calc(18 * var(--u)); letter-spacing: calc(4 * var(--u)); }
        h1.title { font-size: calc(72 * var(--u)); margin-top: calc(12 * var(--u)); }
        .rule { margin-top: calc(18 * var(--u)); height: calc(4 * var(--u)); padding-right: 0; }
        .rule span { width: calc(80 * var(--u)); }
        p.lede {
          margin-top: calc(16 * var(--u)); font-size: calc(15 * var(--u)); line-height: calc(24 * var(--u));
          max-width: calc(380 * var(--u)); text-wrap: balance;
        }
        .cta {
          top: auto; margin-top: calc(28 * var(--u)); height: calc(56 * var(--u));
          position: relative; width: 100%; display: flex; justify-content: center; align-items: center;
        }
        .cta a { width: calc(180 * var(--u)); height: calc(56 * var(--u)); border-radius: calc(28 * var(--u)); }
        .planet-l { width: calc(96 * var(--u)); left: calc(-48 * var(--u)); top: calc(-20 * var(--u)); }
        .planet-r { width: calc(96 * var(--u)); right: calc(-48 * var(--u)); top: calc(-20 * var(--u)); }
        .label { font-size: calc(13 * var(--u)); letter-spacing: calc(3 * var(--u)); }
        .label.label-l { left: calc(52 * var(--u)); top: 50%; transform: translateY(-50%); }
        .label.label-r { right: calc(52 * var(--u)); top: 50%; transform: translateY(-50%); }
        .scroll { width: calc(72 * var(--u)); height: calc(72 * var(--u)); bottom: calc(24 * var(--u)); margin-left: calc(-36 * var(--u)); }
      }

      /* Tier D: Ultra-wide Monitors */
      @media (min-width: 1920px) {
        :root { --u: min(calc(100vw / 1353), calc(100vh / 1163)); }
      }

      /* Tier E: Short / Landscape Mobile */
      @media (max-height: 480px) and (orientation: landscape) {
        .copy { padding-top: calc(10 * var(--u)); }
        .eyebrow { display: none; }
        h1.title { font-size: calc(48 * var(--u)); margin-top: 0; }
        p.lede { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .scroll { display: none; }
      }

      /* Tier F: Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        .planet, .burger span, .links, .cta a, .scroll { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="sky">
        <!-- 3x video elements with data-planet attributes.

    <script>
      (function() {
        'use strict';

        const PLANETS = {
          earth: {
            eyebrow: "HABITABLE BENCHMARK",
            name: "EARTH",
            lede: "Primary photometric reference standard (1.00 R_Earth, 1.00 AU). Calibrates Mandel–Agol limb darkening models and circumstellar Habitable Zone boundaries."
          },
          venus: {
            eyebrow: "GREENHOUSE LIMIT",
            name: "VENUS",
            lede: "Super-critical atmospheric analog (0.95 R_Earth, 0.72 AU). Used to evaluate runaway greenhouse transitions and high-albedo false-positive transit depth anomalies."
          },
          mars: {
            eyebrow: "SUB-HABITABLE DESERT",
            name: "MARS",
            lede: "Sub-Earth cold boundary benchmark (0.53 R_Earth, 1.52 AU). Sets the maximum greenhouse outer edge of the Habitable Zone and thin-atmosphere retention thresholds."
          }
        };

        const ORDER = ['earth', 'venus', 'mars'];

        let featured = 'earth';
        let leftSlot = 'venus';
        let rightSlot = 'mars';
        let isTransitioning = false;

        const videos = {
          earth: document.querySelector('video[data-planet="earth"]'),
          venus: document.querySelector('video[data-planet="venus"]'),
          mars: document.querySelector('video[data-planet="mars"]')
        };

        const btnLeft = document.querySelector('.planet-l');
        const btnRight = document.querySelector('.planet-r');
        const labelLeft = document.querySelector('.label-l');
        const labelRight = document.querySelector('.label-r');

        const eyebrowLine = document.querySelector('.eyebrow .ent-line');
        const titleLine = document.querySelector('.title .ent-line');
        const ledeEl = document.querySelector('p.lede');

        const burgerBtn = document.querySelector('.burger');
        const navRow = document.querySelector('.navrow');

        function playVideoSafely(video) {
          if (!video) return;
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(function() {});
          }
        }

        if (videos.earth) {
          playVideoSafely(videos.earth);
        }

        function crossFadeVideo(nextPlanetKey, prevPlanetKey) {
          const nextVideo = videos[nextPlanetKey];
          const prevVideo = videos[prevPlanetKey];

          if (nextVideo) {
            if (nextVideo.hasAttribute('data-src')) {
              const src = nextVideo.getAttribute('data-src');
              nextVideo.removeAttribute('data-src');
              nextVideo.src = src;
              nextVideo.load();
            }
            nextVideo.classList.add('is-active');
            playVideoSafely(nextVideo);
          }

          if (prevVideo && prevVideo !== nextVideo) {
            setTimeout(function() {
              prevVideo.classList.remove('is-active');
              prevVideo.pause();
            }, 350);
          }
        }

        function updateSlotCutouts(slotBtn, activePlanet) {
          if (!slotBtn) return;
          const imgs = slotBtn.querySelectorAll('img');
          imgs.forEach(function(img) {
            if (img.getAttribute('data-planet') === activePlanet) {
              img.classList.add('is-shown');
            } else {
              img.classList.remove('is-shown');
            }
          });
        }

        function updateCopy(planetKey) {
          const data = PLANETS[planetKey];
          if (!data) return;

          if (eyebrowLine) {
            eyebrowLine.style.opacity = '0';
            eyebrowLine.style.transform = 'translateY(8px)';
          }
          if (titleLine) {
            titleLine.style.opacity = '0';
            titleLine.style.transform = 'translateY(16px)';
          }
          if (ledeEl) {
            ledeEl.style.opacity = '0';
            ledeEl.style.transform = 'translateY(8px)';
          }

          setTimeout(function() {
            if (eyebrowLine) eyebrowLine.textContent = data.eyebrow;
            if (titleLine) titleLine.textContent = data.name;
            if (ledeEl) ledeEl.textContent = data.lede;

            if (eyebrowLine) {
              eyebrowLine.style.transition = 'opacity .35s ease, transform .35s cubic-bezier(.22, 1, .36, 1)';
              eyebrowLine.style.opacity = '1';
              eyebrowLine.style.transform = 'none';
            }
            if (titleLine) {
              titleLine.style.transition = 'opacity .4s ease, transform .4s cubic-bezier(.22, 1, .36, 1)';
              titleLine.style.opacity = '1';
              titleLine.style.transform = 'none';
            }
            if (ledeEl) {
              ledeEl.style.transition = 'opacity .4s ease, transform .4s cubic-bezier(.22, 1, .36, 1)';
              ledeEl.style.opacity = '1';
              ledeEl.style.transform = 'none';
            }
          }, 150);
        }

        function rotateTo(newFeaturedPlanet) {
          if (isTransitioning || newFeaturedPlanet === featured) return;
          isTransitioning = true;

          const prevFeatured = featured;
          featured = newFeaturedPlanet;

          // Recalculate side slots
          const fIdx = ORDER.indexOf(featured);
          leftSlot = ORDER[(fIdx + 1) % 3];
          rightSlot = ORDER[(fIdx + 2) % 3];

          // 1. Seamless Video Cross-Fade
          crossFadeVideo(featured, prevFeatured);

          // 2. Pre-rendered planet cut-out image toggling
          updateSlotCutouts(btnLeft, leftSlot);
          updateSlotCutouts(btnRight, rightSlot);

          // 3. Update slot labels and aria labels
          if (labelLeft) labelLeft.textContent = PLANETS[leftSlot].name;
          if (labelRight) labelRight.textContent = PLANETS[rightSlot].name;
          if (btnLeft) btnLeft.setAttribute('aria-label', 'Select ' + PLANETS[leftSlot].name);
          if (btnRight) btnRight.setAttribute('aria-label', 'Select ' + PLANETS[rightSlot].name);

          // 4. Update Copy
          updateCopy(featured);

          // 5. Release transition lock after 400ms
          setTimeout(function() {
            isTransitioning = false;
          }, 400);
        }

        // Left slot click
        if (btnLeft) {
          btnLeft.addEventListener('click', function() {
            rotateTo(leftSlot);
          });
        }

        // Right slot click
        if (btnRight) {
          btnRight.addEventListener('click', function() {
            rotateTo(rightSlot);
          });
        }

        // Keyboard navigation
        window.addEventListener('keydown', function(e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            rotateTo(leftSlot);
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            rotateTo(rightSlot);
          }
        });

        // Mobile burger toggle
        if (burgerBtn && navRow) {
          burgerBtn.addEventListener('click', function() {
            const isOpen = navRow.getAttribute('data-open') === 'true';
            const nextState = !isOpen;
            navRow.setAttribute('data-open', nextState ? 'true' : 'false');
            burgerBtn.setAttribute('aria-expanded', nextState ? 'true' : 'false');
          });

          const navLinks = navRow.querySelectorAll('.links a');
          navLinks.forEach(function(link) {
            link.addEventListener('click', function() {
              navRow.setAttribute('data-open', 'false');
              burgerBtn.setAttribute('aria-expanded', 'false');
            });
          });
        }

        // Scroll button
        const scrollBtn = document.querySelector('.scroll');
        if (scrollBtn) {
          scrollBtn.addEventListener('click', function() {
            window.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
          });
        }
      })();
    </script>
  </body>
</html>
