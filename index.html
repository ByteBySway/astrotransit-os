    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@500;600;700&family=Prata&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
      // Mock and suppress Vite dev server WebSocket in sandboxed iframe environment
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Intercept WebSocket creation for Vite HMR to prevent connection failures and throws
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function isViteHmr(url, protocols) {
            var u = String(url || '');
            var p = String(protocols || '');
            return p.indexOf('vite-hmr') !== -1 ||
                   u.indexOf('token=') !== -1 ||
                   u.indexOf('vite-hmr') !== -1 ||
                   (u.indexOf('3000') !== -1 && u.indexOf('ws') === 0);
          }

          function MockViteWebSocket(url, protocols) {
            var self = this;
            var target = new EventTarget();
            this.url = String(url || '');
            this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
            this.readyState = 0; // CONNECTING
            this.binaryType = 'blob';
            this.bufferedAmount = 0;
            this.extensions = '';
            this.CONNECTING = 0;
            this.OPEN = 1;
            this.CLOSING = 2;
            this.CLOSED = 3;

            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;

            this.addEventListener = function(t, l, o) { target.addEventListener(t, l, o); };
            this.removeEventListener = function(t, l, o) { target.removeEventListener(t, l, o); };
            this.dispatchEvent = function(e) { return target.dispatchEvent(e); };
            this.send = function() {};
            this.close = function() {
              self.readyState = 3;
              var evt = new Event('close');
              if (typeof self.onclose === 'function') {
                try { self.onclose(evt); } catch (e) {}
              }
              target.dispatchEvent(evt);
            };

            setTimeout(function() {
              if (self.readyState === 0) {
                self.readyState = 1; // OPEN
                var evt = new Event('open');
                if (typeof self.onopen === 'function') {
                  try { self.onopen(evt); } catch (e) {}
                }
                target.dispatchEvent(evt);
              }
            }, 0);
          }

          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          MockViteWebSocket.prototype = Object.create(EventTarget.prototype);

          window.WebSocket = function(url, protocols) {
            if (isViteHmr(url, protocols)) {
              return new MockViteWebSocket(url, protocols);
            }
            return new NativeWebSocket(url, protocols);
          };

          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }

        // 2. Filter out any residual logs or unhandled rejections
        var isWsError = function(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.indexOf('failed to connect to websocket') !== -1 || 
                 (s.indexOf('[vite]') !== -1 && (s.indexOf('websocket') !== -1 || s.indexOf('ws') !== -1)) ||
                 s.indexOf('websocket closed without opened') !== -1;
        };

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack) ? (arg.message || arg.stack) : String(arg));
            if (isWsError(str)) {
              return;
            }
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack) ? (arg.message || arg.stack) : String(arg));
            if (isWsError(str)) {
              return;
            }
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var reasonStr = typeof event.reason === 'string' ? event.reason : (event.reason.message || String(event.reason));
            if (isWsError(reasonStr)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          }
        });
        window.addEventListener('error', function(event) {
          if (event && (isWsError(event.message) || isWsError(event.error))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        });
      })();
    </script>

      html {
        scroll-behavior: smooth;
      }
