    <script>
      // Suppress benign Vite dev server WebSocket disconnect rejections in sandboxed iframes
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var reasonStr = typeof event.reason === 'string' ? event.reason : (event.reason.message || String(event.reason));
          if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }
      });
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('websocket') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return false;
        }
      });
    </script>
