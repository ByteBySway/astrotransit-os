    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@500;600;700&family=Prata&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
      // Suppress benign Vite dev server WebSocket disconnect logs in sandboxed iframe environment
      (function() {
        var isWsError = function(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.indexOf('failed to connect to websocket') !== -1 || 
                 (s.indexOf('[vite]') !== -1 && (s.indexOf('websocket') !== -1 || s.indexOf('ws') !== -1)) ||
                 s.indexOf('websocket closed without opened') !== -1;
        };

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack) ? (arg.message || arg.stack) : String(arg));
            if (isWsError(str)) {
              return; // Filter out benign Vite HMR sandbox disconnection logs
            }
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack) ? (arg.message || arg.stack) : String(arg));
            if (isWsError(str)) {
              return;
            }
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var reasonStr = typeof event.reason === 'string' ? event.reason : (event.reason.message || String(event.reason));
            if (isWsError(reasonStr)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          }
        });
        window.addEventListener('error', function(event) {
          if (event && (isWsError(event.message) || isWsError(event.error))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        });
      })();
    </script>

    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
